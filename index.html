<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEDxHongikU 2026 초대장</title>
<meta name="description" content="허성범 님, 11월 21일 TEDxHongikU ‘표류’에 초대합니다.">
<meta property="og:title" content="TEDxHongikU 2026 초대장">
<meta property="og:description" content="허성범 님, 11월 21일 TEDxHongikU ‘표류’에 초대합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #000000;
    --paper: #FFFFFF;
    --red: #E62B1E;
    --sea-deep: #06183A;
    --sea: #0D3570;
    --sea-bright: #1A56A6;
    --gold: linear-gradient(135deg, #9C7A3C, #E6CF8F 28%, #B08A45 52%, #EAD7A0 78%, #A3823F);
    --w: min(80vw, 340px);
    --envH: calc(var(--w) * .7);
    --lw: calc(var(--w) * .92);
    --lh: calc(var(--w) * .68);
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #000000; --paper: #FFFFFF; --red: #E62B1E; }
  }
  :root[data-theme="dark"] { --ink: #000000; --paper: #FFFFFF; --red: #E62B1E; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--paper);
    overflow: hidden;
    font-family: "Noto Serif KR", "Nanum Myeongjo", "AppleMyungjo", serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  /* 바다 */
  .sea {
    position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 1;
    background: linear-gradient(to bottom,
      var(--ink) 0%, var(--ink) 29%,
      var(--sea-deep) 40%, var(--sea) 70%, var(--sea-bright) 100%);
  }
  .wave {
    position: absolute; left: 0; width: 200vw; height: 40px;
    animation: drift linear infinite;
  }
  .wave path { fill: none; stroke: var(--paper); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .front {
    position: fixed; left: 0; width: 200vw; height: 1000px; z-index: 5;
    pointer-events: none; animation: drift 17s linear infinite;
  }
  .front .crest { fill: none; stroke: var(--paper); stroke-opacity: .65; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  @keyframes drift { from { transform: translateX(-50%); } to { transform: translateX(0); } }

  /* 봉투 */
  .scene { position: fixed; left: 50%; top: 44%; width: 0; height: 0; z-index: 3; }
  .boat {
    position: absolute;
    left: calc(var(--w) / -2); top: calc(var(--envH) / -2);
    width: var(--w); height: var(--envH);
    transform: translateX(-200vw);
    will-change: transform, opacity;
  }
  .env {
    position: relative; width: 100%; height: 100%;
    perspective: 900px; cursor: pointer; outline: none;
  }
  .env:focus-visible { outline: 2px solid var(--red); outline-offset: 8px; }
  .env-back { position: absolute; inset: 0; z-index: 1; background: var(--paper); }
  .env.flap-open .env-back { background: var(--red); }

  .env-pocket {
    position: absolute; inset: 0; z-index: 4; background: var(--paper);
    clip-path: polygon(0 0, 50% 64%, 100% 0, 100% 100%, 0 100%);
  }
  .env-pocket svg, .flap-front svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .env-pocket path, .flap-front path { fill: none; vector-effect: non-scaling-stroke; }

  .flap-shadow {
    position: absolute; inset: 0; z-index: 5;
    background: rgba(0, 0, 0, .1);
    clip-path: polygon(0 0, 100% 0, 50% 70%);
    transition: opacity .3s;
  }
  .env.flap-open .flap-shadow { opacity: 0; }

  .env-flap {
    position: absolute; inset: 0; z-index: 6;
    transform-origin: 50% 0; transform-style: preserve-3d;
    transition: transform .72s cubic-bezier(.45, .05, .2, 1);
  }
  .env.flap-open .env-flap { transform: rotateX(180deg); }
  .env.flap-behind .env-flap { z-index: 2; }
  .flap-face {
    position: absolute; inset: 0;
    clip-path: polygon(0 0, 100% 0, 50% 66%);
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  .flap-front { background: var(--paper); }
  .flap-back { background: var(--red); transform: rotateY(180deg); }

  /* 봉인: 들쭉날쭉한 선을 따라 찢어져, 윗조각은 덮개와 함께 넘어가고 아랫조각은 봉투에 남음 */
  .seal {
    position: absolute; z-index: 7;
    width: calc(var(--w) * .14); aspect-ratio: 1;
    left: 50%; top: calc(var(--envH) * .6);
    transform: translate(-50%, -50%);
    transform-origin: 88% 50%;
    transition: transform .25s ease-out;
  }
  .seal::before, .seal::after { content: ""; position: absolute; border-radius: 50%; }
  .seal::before { inset: 0; background: var(--red); }
  .seal::after { inset: 20%; border: 1px solid rgba(255, 255, 255, .8); }
  .seal-top {
    clip-path: polygon(0 0, 100% 0, 100% 47%, 95% 50%, 89% 46%, 84% 51%, 77% 48%, 72% 53%, 66% 50%,
      60% 55%, 52% 51%, 47% 56%, 41% 52%, 33% 58%, 28% 54%, 21% 59%, 14% 55%, 7% 60%, 0 56%);
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
  }
  /* 아랫조각은 찢는 선 위로 살짝 겹쳐 그려 찢기 전에는 이음매가 보이지 않게 함 */
  .seal-bottom {
    clip-path: polygon(0 53%, 7% 57%, 14% 52%, 21% 56%, 28% 51%, 33% 55%, 41% 49%, 47% 53%, 52% 48%,
      60% 52%, 66% 47%, 72% 50%, 77% 45%, 84% 48%, 89% 43%, 95% 47%, 100% 44%, 100% 100%, 0 100%);
  }
  .env.pressed .seal { transform: translate(-50%, -50%) scale(1.08); }
  .env.broken .seal { transition: transform .45s cubic-bezier(.2, .8, .3, 1); }
  .env.broken .seal-bottom { transform: translate(-50%, -50%) translateY(3%) rotate(-7deg); }
  /* 윗조각은 덮개 면보다 1px 앞에 두어 덮개와 함께 넘어가며 겹쳐 보이지 않게 함 */
  .seal-top { transform: translate3d(-50%, -50%, 1px); }
  .env.pressed .seal-top { transform: translate3d(-50%, -50%, 1px) scale(1.08); }
  .env.broken .seal-top { transform: translate3d(-50%, -50%, 1px) translateY(-3%) rotate(10deg); }

  /* 편지 */
  .letter {
    position: absolute; z-index: 3;
    left: calc((var(--w) - var(--lw)) / 2);
    top: calc((var(--envH) - var(--lh)) / 2);
    width: var(--lw); height: var(--lh);
    perspective: 1600px;
    transition: transform 1s cubic-bezier(.3, .6, .2, 1);
  }
  /* 편지 아래 끝이 봉투 윗변에 닿을 때까지 꺼냄 */
  .letter.out { transform: translateY(calc((var(--envH) + var(--lh)) / -2)); }
  .letter p { margin: 0; }
  .panel {
    position: absolute; left: 0; width: 100%;
    box-sizing: border-box; padding: calc(var(--w) * .066) calc(var(--w) * .08);
    display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    font-weight: 500;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .panel.top { top: 0; height: 100%; z-index: 2; justify-content: center; }
  .panel.bottom {
    top: 100%; min-height: var(--lh); z-index: 1; justify-content: center;
    transform-origin: 50% 0; transform: rotateX(-180deg);
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    transition: transform 1.2s cubic-bezier(.25, .7, .2, 1);
  }
  .letter.unfold .panel.bottom { transform: rotateX(0deg); }
  .panel.bottom::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px;
    background: linear-gradient(rgba(0, 0, 0, .07), rgba(0, 0, 0, 0));
    pointer-events: none;
  }
  .panel.bottom::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(rgba(0, 0, 0, .35), rgba(0, 0, 0, 0) 75%);
    transition: opacity 1.2s;
  }
  .letter.unfold .panel.bottom::after { opacity: 0; }

  /* 금색 테두리: 윗면은 위·양옆, 아랫면은 아래·양옆에 둘러 펼치면 하나의 틀이 됨 */
  .frame {
    position: absolute; pointer-events: none;
    border: 0 solid; border-image: var(--gold) 1;
  }
  .panel.top .frame {
    inset: calc(var(--w) * .024) calc(var(--w) * .024) 0;
    border-width: 1px 1px 0;
  }
  .panel.bottom .frame {
    inset: 0 calc(var(--w) * .024) calc(var(--w) * .024);
    border-width: 0 1px 1px;
  }

  /* 편지 윗면: 받는 분, 인사말 */
  .to { display: flex; align-items: baseline; gap: .6em; }
  .to-label {
    font-size: calc(var(--w) * .03); font-weight: 600; letter-spacing: .2em;
    color: var(--red);
  }
  .to-name {
    font-size: calc(var(--w) * .084); font-weight: 800;
    letter-spacing: -.025em; line-height: 1.15;
  }
  .greet {
    margin-top: calc(var(--w) * .036) !important;
    padding-top: calc(var(--w) * .036);
    border-top: 1px solid rgba(0, 0, 0, .14);
    font-size: calc(var(--w) * .037); line-height: 1.75; letter-spacing: -.01em;
    text-wrap: pretty;
  }
  .theme { color: var(--sea-bright); font-weight: 600; }

  /* 편지 아랫면: 일시, 장소, 연사 (이름표 칸을 맞춰 한 줄기로 정렬) */
  .info { margin: 0; }
  .info > div {
    display: grid; grid-template-columns: calc(var(--w) * .105) 1fr;
    align-items: baseline; column-gap: calc(var(--w) * .025);
    padding: calc(var(--w) * .013) 0;
  }
  .info > div:first-child { padding-top: 0; }
  .info > div + div { border-top: 1px solid rgba(0, 0, 0, .14); }
  .info > div:last-child { border-bottom: 1px solid rgba(0, 0, 0, .14); }
  .info dt, .speakers dt { font-size: calc(var(--w) * .033); letter-spacing: .12em; opacity: .5; }
  .info dd { margin: 0; font-size: calc(var(--w) * .04); line-height: 1.5; }
  .date {
    font-size: calc(var(--w) * .088); font-weight: 800; color: var(--red);
    letter-spacing: -.035em; line-height: 1.1;
  }
  .time {
    margin-top: calc(var(--w) * .01) !important;
    font-size: calc(var(--w) * .038); line-height: 1.35; letter-spacing: -.005em;
  }
  .time .dot { margin: 0 .45em; opacity: .4; }
  .speakers {
    margin: 0; display: grid; grid-template-columns: auto auto;
    justify-content: start; align-items: baseline;
    row-gap: 0; column-gap: calc(var(--w) * .07);
  }
  .speakers div { display: flex; align-items: baseline; gap: .5em; }
  .speakers dt { letter-spacing: .04em; }
  .speakers dd { margin: 0; font-size: calc(var(--w) * .042); font-weight: 600; line-height: 1.4; }
  .sign {
    margin-top: calc(var(--w) * .018) !important;
    text-align: right; font-size: calc(var(--w) * .038); font-weight: 600; letter-spacing: .01em;
  }
  .sign .tedx { color: var(--red); }

  .top-layer { position: fixed; inset: 0; z-index: 9; pointer-events: none; }

  /* 안내 */
  .hint, .replay {
    position: fixed; left: 50%; z-index: 10;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 7vh);
    transform: translateX(-50%);
    font-family: inherit; font-size: 14px; font-weight: 400; letter-spacing: .03em;
    color: var(--paper); white-space: nowrap;
    opacity: 0; transition: opacity .8s; pointer-events: none;
  }
  .hint.show { opacity: .8; }
  .replay {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 3vh);
    background: none; border: 1px solid rgba(255, 255, 255, .45); border-radius: 999px;
    padding: 10px 20px; cursor: pointer;
  }
  .replay.show { opacity: .9; pointer-events: auto; }
  .replay:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .wave, .front { animation: none; }
    *, *::before, *::after { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <div class="sea" id="sea" aria-hidden="true"></div>

  <div class="scene">
    <div class="boat" id="boat">
      <div class="env" id="env" role="button" tabindex="0" aria-label="초대장 열기" aria-expanded="false">
        <div class="env-back"></div>

        <div class="letter" id="letter">
          <div class="panel bottom" id="letterBottom">
            <dl class="info">
              <div>
                <dt>일시:</dt>
                <dd>
                  <p class="date">11월 21일</p>
                  <p class="time">토요일<span class="dot" aria-hidden="true">·</span>오후 2시 – 5시 10분</p>
                </dd>
              </div>
              <div>
                <dt>장소</dt>
                <dd>홍익대학교 서울캠퍼스<br>홍문관 지하 4층 가람홀</dd>
              </div>
              <div>
                <dt>연사</dt>
                <dd>
                  <dl class="speakers">
                    <div><dt>환경</dt><dd>홍다경</dd></div>
                    <div><dt>예술</dt><dd>배진희</dd></div>
                    <div><dt>사회</dt><dd>노경철</dd></div>
                    <div><dt>기술</dt><dd>백영재</dd></div>
                  </dl>
                </dd>
              </div>
            </dl>
            <p class="sign"><span class="tedx">TEDx</span>HongikU 드림</p>
            <span class="frame" aria-hidden="true"></span>
          </div>
          <div class="panel top" id="letterTop">
            <p class="to"><span class="to-label">TO.</span><span class="to-name">허성범 님</span></p>
            <p class="greet" id="greet">안녕하십니까. 이번 2026 TEDxHongikU 강연은, <span class="theme">‘표류’</span>라는 테마 아래 환경, 예술, 사회, 기술 네 분야의 연사를 모시고 강연을 진행하게 되었습니다. 바쁘시겠지만, 귀한 걸음 하시어 자리를 빛내주시기를 정중히 청합니다.</p>
            <span class="frame" aria-hidden="true"></span>
          </div>
        </div>

        <div class="env-pocket">
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 0 L50 64 L100 0" stroke="rgba(0,0,0,.22)" stroke-width="1"/>
            <path d="M0 100 L50 70 L100 100" stroke="rgba(0,0,0,.08)" stroke-width="1"/>
          </svg>
        </div>
        <div class="flap-shadow"></div>
        <div class="env-flap">
          <div class="flap-face flap-front">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <path d="M0 0 L50 66 L100 0" stroke="rgba(0,0,0,.22)" stroke-width="1.2"/>
            </svg>
          </div>
          <div class="flap-face flap-back"></div>
          <div class="seal seal-top" aria-hidden="true"></div>
        </div>
        <div class="seal seal-bottom" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <svg class="front" id="front" viewBox="0 0 2400 1000" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="seaFill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="520">
        <stop offset="0" stop-color="#1F64BF"/>
        <stop offset=".45" stop-color="#13448A"/>
        <stop offset="1" stop-color="#0A2A5C"/>
      </linearGradient>
    </defs>
    <path id="frontFill" fill="url(#seaFill)"/>
    <path class="crest" id="frontCrest"/>
  </svg>

  <div class="top-layer" id="topLayer"></div>

  <p class="hint" id="hint">봉투를 눌러 열어보세요</p>
  <button class="replay" id="replay" type="button">다시 보기</button>

<script>
(function () {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const D = reduce ? 0 : 1;

  const sea = document.getElementById('sea');
  const boat = document.getElementById('boat');
  const env = document.getElementById('env');
  const letter = document.getElementById('letter');
  const letterBottom = document.getElementById('letterBottom');
  const hint = document.getElementById('hint');
  const replay = document.getElementById('replay');
  const topLayer = document.getElementById('topLayer');
  const front = document.getElementById('front');
  const letterTop = document.getElementById('letterTop');
  const greet = document.getElementById('greet');

  const wait = ms => new Promise(r => setTimeout(r, ms * D));
  const tween = (dur, fn, ease = t => t) => new Promise(res => {
    if (dur <= 0) { fn(1); res(); return; }
    const s = performance.now();
    (function step(n) {
      const p = Math.min((n - s) / dur, 1);
      fn(ease(p));
      p < 1 ? requestAnimationFrame(step) : res();
    })(s);
  });

  // 물결 경로 (가로 2400, 절반인 1200마다 반복되도록 파장을 맞춤)
  function wavePath(amp, len, y) {
    let d = `M0 ${y}`;
    for (let x = 0; x < 2400; x += len) {
      d += ` Q ${x + len / 4} ${y - amp} ${x + len / 2} ${y} T ${x + len} ${y}`;
    }
    return d;
  }

  const lens = [400, 300, 240, 200, 240, 300, 200, 240, 300];
  lens.forEach((len, i) => {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'wave');
    svg.setAttribute('viewBox', '0 0 2400 40');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.style.top = `calc(${30 + i * 6.5}% - 20px)`;
    svg.style.opacity = (0.1 + i * 0.045).toFixed(3);
    svg.style.animationDuration = `${64 - i * 5}s`;
    svg.style.animationDelay = `${-i * 3.1}s`;
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', wavePath(2 + i * 1.3, len, 20));
    svg.appendChild(p);
    sea.appendChild(svg);
  });

  const crestD = wavePath(9, 300, 24);
  document.getElementById('frontCrest').setAttribute('d', crestD);
  document.getElementById('frontFill').setAttribute('d', crestD + ' L 2400 1000 L 0 1000 Z');

  const envH = () => boat.offsetHeight;
  const envW = () => boat.offsetWidth;

  function placeFront() {
    front.style.top = (innerHeight * 0.44 + envH() * 0.32 - 24) + 'px';
  }
  placeFront();

  // 편지 윗면은 봉투에 들어갈 높이로 고정돼 있으므로,
  // 대체 서체 등으로 인사말이 넘치면 글자 크기를 조금씩 줄여 맞춤
  function fitTop() {
    greet.style.fontSize = '';
    const cs = getComputedStyle(letterTop);
    const room = letterTop.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const used = () => greet.offsetTop + greet.offsetHeight - letterTop.firstElementChild.offsetTop;
    let f = parseFloat(getComputedStyle(greet).fontSize);
    while (used() > room && f > 9) {
      f -= 0.25;
      greet.style.fontSize = f + 'px';
    }
  }
  fitTop();
  if (document.fonts) document.fonts.ready.then(fitTop);

  // 표류 + 흔들림 (기존 3.4초의 0.9배 속도)
  let state = 'drifting';
  let amp = reduce ? 0 : 1, ampTarget = reduce ? 0 : 1;
  let sink = 0;
  const DRIFT = (3400 / 0.9) * D;
  const t0 = performance.now();
  const startX = -(innerWidth / 2 + envW());

  function frame(now) {
    const p = DRIFT ? Math.min((now - t0) / DRIFT, 1) : 1;
    const e = 1 - Math.pow(1 - p, 3);
    const s = now / 1000;
    amp += (ampTarget - amp) * 0.06;
    const x = startX * (1 - e);
    const y = Math.sin(s * 1.3) * 7 * amp + 12 * (1 - e) + sink;
    const r = -12 * (1 - e) + Math.sin(s * 1.05 + 0.6) * 2.2 * amp;
    boat.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`;
    if (p >= 1 && state === 'drifting') {
      state = 'ready';
      hint.classList.add('show');
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 열기
  let baseRect = null, letterAnim = null;

  function finalTransform() {
    const { left, top, w, h } = baseRect;
    const total = h + letterBottom.offsetHeight;
    // 아래 '다시 보기' 버튼 자리를 비워 두고, 그 위 영역의 가운데에 편지를 놓음
    const areaTop = innerHeight * 0.05;
    const areaH = replay.getBoundingClientRect().top - 12 - areaTop;
    const S = Math.min(1.25, areaH / total, (innerWidth * 0.9) / w);
    const tx = (innerWidth - w * S) / 2 - left;
    const ty = areaTop + (areaH - total * S) / 2 - top;
    return `translate(${tx}px, ${ty}px) scale(${S})`;
  }

  async function openInvite() {
    if (state !== 'ready') return;
    state = 'opening';
    hint.classList.remove('show');
    env.setAttribute('aria-expanded', 'true');
    ampTarget = 0;

    env.classList.add('pressed');
    await wait(260);
    env.classList.add('broken');
    await wait(420);
    env.classList.add('flap-open');
    await wait(360);
    env.classList.add('flap-behind');
    await wait(380);
    letter.classList.add('out');
    await wait(1000);

    // 편지를 봉투 밖 레이어로 옮겨 파도 위로 띄움
    const r = letter.getBoundingClientRect();
    baseRect = { left: r.left, top: r.top, w: r.width, h: r.height };
    letter.style.transition = 'none';
    letter.classList.remove('out');
    letter.style.left = r.left + 'px';
    letter.style.top = r.top + 'px';
    letter.style.transformOrigin = '0 0';
    topLayer.appendChild(letter);
    void letter.offsetWidth;

    letterAnim = letter.animate(
      [{ transform: 'translate(0px, 0px) scale(1)' }, { transform: finalTransform() }],
      { duration: 1050 * D, easing: 'cubic-bezier(.22,.7,.2,1)', fill: 'forwards' }
    );
    tween(1400 * D, p => {
      sink = p * envH() * 1.5;
      boat.style.opacity = String(1 - Math.max(0, (p - 0.55) / 0.45));
    }, t => t * t);

    await wait(650);
    letter.classList.add('unfold');
    await wait(1250);
    state = 'open';
    replay.classList.add('show');
  }

  env.addEventListener('click', openInvite);
  env.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvite(); }
  });
  replay.addEventListener('click', () => location.reload());

  addEventListener('resize', () => {
    placeFront();
    fitTop();
    if (baseRect && letter.parentElement === topLayer) {
      if (letterAnim) { letterAnim.cancel(); letterAnim = null; }
      letter.style.transform = finalTransform();
    }
  });
})();
</script>
</body>
</html>
